name: Isolated contribution validation
on:
  push:
    branches: [verify/oss-20261027]
permissions:
  contents: read
jobs:
  candidate:
    name: candidate / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    env:
      CI: true
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 509745dae480cec27aca18a2184942c81bd61d9d
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: ${{ matrix.node }}
      - name: Record source and runtime
        run: |
          git rev-parse HEAD
          node --version
          npm --version
      - name: Apply frozen snapshot candidate
        run: |
          python -c "import base64,pathlib,os; p=pathlib.Path(os.environ['RUNNER_TEMP'],'candidate.patch');p.write_bytes(base64.b64decode(''))"
          git apply --check "$RUNNER_TEMP/candidate.patch"
          git apply "$RUNNER_TEMP/candidate.patch"
          python -c 'import hashlib,pathlib,json; expected={"src/cli/actions/encrypt.js": "d43023fe824b136668b685a23a2210ee2603397557d6c630486545dd336131d4", "src/lib/transforms/encrypt.js": "3e6835a33f356a3f5329ef95f4d01653514f7c2d0770db1c7e437653348a3f21", "src/lib/helpers/withKeyFileLock.js": "c20aa440bbb660cc1ef874d7e9ff0802c419c2143675920f81d57abe062aba16", "src/lib/helpers/readKeyFileSnapshot.js": "99fac200834195ecf688e8babf1208e75e5188a68af38dc873bb6f6a571ab604", "tests/e2e/encrypt-concurrent.test.js": "3e820b3e3642d7b2a717dacacf7a329770779766e1ad17d2e629afe6342f9878", "tests/lib/helpers/withKeyFileLock.test.js": "43413fc307e90fa11196524f6863be9857aea38dd5db51e010aa99184a9b04a8", "tests/lib/helpers/readKeyFileSnapshot.test.js": "0ee99fa6467e114940daeef6f5d04509dfede31c250462e35850e441b8a4a859"}; actual={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in expected}; print("SOURCE_HASHES",json.dumps(actual)); assert actual==expected'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Full test suite
        run: npm test
      - name: Native unused key path regression
        run: |
          python -c "import base64,pathlib,os;pathlib.Path(os.environ['RUNNER_TEMP'],'probe.cjs').write_bytes(base64.b64decode(''))"
          node "$RUNNER_TEMP/probe.cjs" "$PWD" > "$RUNNER_TEMP/native.jsonl"
          cat "$RUNNER_TEMP/native.jsonl"
          python -c 'import json,pathlib,os; s=pathlib.Path(os.environ["RUNNER_TEMP"],"native.jsonl").read_text(); d=json.loads(s.split("ENOTDIR_RESULT ")[1]); assert d["exit"]==0 and d["encrypted"] and d["nativeCode"]=="ENOTDIR"'
      - name: Standard lint
        if: always()
        run: npm run standard
      - name: Install upstream-pinned shellspec
        if: always()
        run: |
          curl --fail --location --max-time 60 https://raw.githubusercontent.com/shellspec/shellspec/b8935ec266d2c5f7f364c6024730e4d68432cce3/install.sh -o "$RUNNER_TEMP/install-shellspec.sh"
          sh "$RUNNER_TEMP/install-shellspec.sh" 0.28.1 --yes --prefix "$RUNNER_TEMP/shellspec"
          echo "$RUNNER_TEMP/shellspec/bin" >> "$GITHUB_PATH"
      - name: Shell suite
        if: always()
        run: npm run testshell
      - name: Verify candidate unchanged
        if: always()
        run: |
          git diff --check
          python -c 'import hashlib,pathlib,json; expected={"src/cli/actions/encrypt.js": "d43023fe824b136668b685a23a2210ee2603397557d6c630486545dd336131d4", "src/lib/transforms/encrypt.js": "3e6835a33f356a3f5329ef95f4d01653514f7c2d0770db1c7e437653348a3f21", "src/lib/helpers/withKeyFileLock.js": "c20aa440bbb660cc1ef874d7e9ff0802c419c2143675920f81d57abe062aba16", "src/lib/helpers/readKeyFileSnapshot.js": "99fac200834195ecf688e8babf1208e75e5188a68af38dc873bb6f6a571ab604", "tests/e2e/encrypt-concurrent.test.js": "3e820b3e3642d7b2a717dacacf7a329770779766e1ad17d2e629afe6342f9878", "tests/lib/helpers/withKeyFileLock.test.js": "43413fc307e90fa11196524f6863be9857aea38dd5db51e010aa99184a9b04a8", "tests/lib/helpers/readKeyFileSnapshot.test.js": "0ee99fa6467e114940daeef6f5d04509dfede31c250462e35850e441b8a4a859"}; actual={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in expected}; print("FINAL_SOURCE_HASHES",json.dumps(actual)); assert actual==expected'

